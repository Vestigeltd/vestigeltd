name = "vestigeltd"
main = "src/worker.js"
compatibility_date = "2026-08-31"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
preview_urls = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/bc10000", "/bc10000/*", "/flavours/*", "/contact", "/contact.html", "/privacy-policy", "/privacy-policy.html", "/terms-and-conditions", "/terms-and-conditions.html", "/returns-refunds", "/returns-refunds.html", "/vape-durbanville", "/vape-durbanville.html", "/owner", "/owner.html", "/order-status", "/order-status.html"]

[[d1_databases]]
binding = "CHECKOUT_DB"
database_name = "vestige-checkout"
database_id = "da38e52e-adc9-407a-8cf9-6f4b59821f4b"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]
[observability]
enabled = true

[observability.logs]
enabled = true
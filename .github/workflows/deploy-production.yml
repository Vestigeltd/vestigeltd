name: Deploy Vestige production Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vestige-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete repository validation
        run: npm run check

      - name: Check Cloudflare deployment credentials
        id: cloudflare
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CF_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Production deployment skipped. Add the CLOUDFLARE_API_TOKEN repository secret to enable automatic Cloudflare deployment."
          fi

      - name: Deploy production Worker and static assets
        if: steps.cloudflare.outputs.available == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report skipped deployment
        if: steps.cloudflare.outputs.available != 'true'
        run: echo "Source validation passed. Cloudflare deployment was skipped because CLOUDFLARE_API_TOKEN is not configured."
